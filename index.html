<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#b8860b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CRM الذهبي">
  <title>CRM الذهبي | متابعة العملاء</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"CRM الذهبي - متابعة العملاء","short_name":"CRM","start_url":".","display":"standalone","background_color":"#fdfaf5","theme_color":"#b8860b","orientation":"portrait","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'256\' cy=\'256\' r=\'240\' fill=\'%23b8860b\'/%3E%3Cpath d=\'M160 200 L256 120 L352 200 L352 380 L160 380 Z\' fill=\'none\' stroke=\'white\' stroke-width=\'20\'/%3E%3Ccircle cx=\'256\' cy=\'260\' r=\'40\' fill=\'white\'/%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>
  
  <style>
    /* ========== CSS Variables - Light & Dark ========== */
    :root {
      --bg-gradient: linear-gradient(135deg, #fdfaf5 0%, #f5f0e8 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --gold: #b8860b;
      --gold-light: #d4a017;
      --gold-dark: #8b6508;
      --text: #1e1e1e;
      --text-secondary: #5a5a5a;
      --surface: rgba(255, 255, 255, 0.7);
      --input-bg: rgba(255, 255, 255, 0.8);
      --border: rgba(184, 134, 11, 0.2);
      --card-bg: rgba(255, 255, 255, 0.6);
      --table-header: linear-gradient(135deg, #b8860b, #8b6508);
      --hover-bg: rgba(184, 134, 11, 0.08);
      --status-first: #e3f2fd;
      --status-first-text: #01579b;
      --status-cold: #eceff1;
      --status-cold-text: #455a64;
      --status-hot: #fff3e0;
      --status-hot-text: #bf360c;
      --status-lead: #e8f5e9;
      --status-lead-text: #1b5e20;
      --backdrop-blur: blur(20px);
      --stat-card-bg: rgba(255, 255, 255, 0.7);
    }

    body.dark {
      --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --glass-bg: rgba(30, 30, 50, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --text: #f0e6d2;
      --text-secondary: #b0a890;
      --surface: rgba(30, 30, 50, 0.6);
      --input-bg: rgba(40, 40, 60, 0.7);
      --border: rgba(184, 134, 11, 0.3);
      --card-bg: rgba(40, 40, 60, 0.5);
      --table-header: linear-gradient(135deg, #8b6508, #6b4e06);
      --hover-bg: rgba(184, 134, 11, 0.15);
      --status-first: rgba(2, 136, 209, 0.2);
      --status-first-text: #81d4fa;
      --status-cold: rgba(120, 144, 156, 0.2);
      --status-cold-text: #b0bec5;
      --status-hot: rgba(230, 81, 0, 0.2);
      --status-hot-text: #ffab91;
      --status-lead: rgba(46, 125, 50, 0.2);
      --status-lead-text: #a5d6a7;
      --stat-card-bg: rgba(40, 40, 60, 0.6);
    }

    /* ========== Base Styles ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Cairo', 'Tahoma', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية زخرفية */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 70%, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ========== Glass Container ========== */
    .glass-container {
      background: var(--glass-bg);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
      padding: 20px 18px;
      transition: all 0.4s ease;
    }

    @media (min-width: 768px) {
      .glass-container {
        padding: 28px 32px;
        border-radius: 32px;
      }
    }

    /* ========== Header ========== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      font-size: 2rem;
      -webkit-text-fill-color: initial;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ========== Buttons ========== */
    .btn {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 16px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn:hover {
      background: var(--gold);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(184, 134, 11, 0.4);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 8px rgba(184, 134, 11, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    }

    .btn-ghost {
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover {
      background: var(--hover-bg);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-icon:hover {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    /* ========== Form Elements ========== */
    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 120px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    input, select, textarea {
      background: var(--input-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      font-family: inherit;
      color: var(--text);
      font-size: 0.9rem;
      transition: all 0.3s ease;
      width: 100%;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 36px;
    }

    /* ========== Table ========== */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }
    th {
      background: var(--table-header);
      color: #fff;
      padding: 14px 10px;
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      white-space: nowrap;
    }
    td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    tr:hover td {
      background: var(--hover-bg);
    }

    .status-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .status-first { background: var(--status-first); color: var(--status-first-text); }
    .status-cold { background: var(--status-cold); color: var(--status-cold-text); }
    .status-hot { background: var(--status-hot); color: var(--status-hot-text); }
    .status-lead { background: var(--status-lead); color: var(--status-lead-text); }

    .whatsapp-link {
      color: #25D366;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.1rem;
      transition: transform 0.2s;
      display: inline-block;
    }
    .whatsapp-link:hover {
      transform: scale(1.2);
    }

    .delete-btn {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid rgba(220, 53, 69, 0.3);
      color: #dc3545;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:hover {
      background: #dc3545;
      color: #fff;
      transform: scale(1.1);
    }

    /* ========== Stats Cards ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
    }
    .stat-card {
      background: var(--stat-card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 10px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
      border-color: var(--gold);
    }
    .stat-card strong {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .stat-card span {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
    }

    /* ========== Login Screen ========== */
    .login-container {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }
    .login-container .logo {
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .message-toast {
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.85rem;
      margin: 8px 0;
      display: none;
      backdrop-filter: blur(10px);
    }
    .message-toast.show { display: block; }
    .message-toast.success { background: rgba(46, 125, 50, 0.2); color: #2e7d32; border: 1px solid rgba(46,125,50,0.3); }
    .message-toast.error { background: rgba(220, 53, 69, 0.2); color: #c62828; border: 1px solid rgba(220,53,69,0.3); }

    /* ========== Loading ========== */
    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(184,134,11,0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* ========== Responsive ========== */
    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .btn { padding: 8px 12px; font-size: 0.8rem; }
      .logo { font-size: 1.3rem; }
      th, td { padding: 8px 6px; font-size: 0.75rem; }
    }

    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .glass-container { box-shadow: none; border: 1px solid #ddd; }
    }

    /* ========== PWA Install Prompt ========== */
    .install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 9999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- ==================== شاشة تسجيل الدخول ==================== -->
  <div id="loginScreen" class="glass-container login-container">
    <div class="logo">
      <span class="logo-icon">💎</span> CRM الذهبي
    </div>
    <p style="color: var(--text-secondary); margin-bottom: 16px;">سجل دخولك أو أنشئ حساب جديد</p>
    
    <div id="loginMessage" class="message-toast"></div>
    
    <div class="form-group" style="margin-bottom: 10px;">
      <label>👤 اسم المستخدم</label>
      <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم" autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom: 16px;">
      <label>🔒 كلمة المرور</label>
      <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="current-password">
    </div>
    
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button id="loginBtn" class="btn btn-primary">🔑 دخول</button>
      <button id="registerBtn" class="btn btn-ghost">✨ حساب جديد</button>
    </div>
    <p style="font-size:0.7rem; color:var(--text-secondary); margin-top:14px;">
      بياناتك محفوظة في Google Sheets بشكل آمن
    </p>
  </div>

  <!-- ==================== اللوحة الرئيسية ==================== -->
  <div id="mainPanel" class="hidden">
    <!-- Header -->
    <div class="glass-container" style="margin-bottom: 4px;">
      <div class="app-header">
        <div class="logo"><span class="logo-icon">💎</span> CRM</div>
        <div class="header-actions no-print">
          <span style="color:var(--text-secondary);font-size:0.85rem;">👤 <strong id="currentUserDisplay"></strong></span>
          <button id="importBtn" class="btn btn-ghost">📥</button>
          <button id="printBtn" class="btn btn-ghost">🖨️</button>
          <button id="logoutBtn" class="btn btn-ghost">🚪</button>
          <span id="themeToggleBtn" class="btn-icon" title="تغيير الثيم">🌓</span>
        </div>
      </div>
    </div>

    <!-- إضافة عميل -->
    <div class="glass-container no-print">
      <div class="form-row">
        <div class="form-group">
          <label>اسم العميل</label>
          <input type="text" id="newName" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label>رقم الموبايل</label>
          <input type="text" id="newMobile" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label>الحالة</label>
          <select id="newStatus">
            <option value="first">🆕 اول مرة</option>
            <option value="cold">❄️ بارد</option>
            <option value="hot">🔥 ساخن</option>
            <option value="lead">⭐ محتمل</option>
          </select>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button id="addClientBtn" class="btn btn-primary" style="width:100%;">➕ إضافة</button>
        </div>
      </div>
    </div>

    <!-- جدول العملاء -->
    <div class="glass-container" style="padding: 12px;">
      <div class="table-wrapper">
        <table id="clientsTable">
          <thead>
            <tr>
              <th>الاسم</th><th>الموبايل</th><th>الحالة</th><th>واتساب</th><th>آخر تواصل</th><th>ملاحظات</th><th>حذف</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="glass-container no-print">
      <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><strong>📊 الكل</strong><span id="totalCount">0</span></div>
        <div class="stat-card"><strong>🆕 اول مرة</strong><span id="firstCount">0</span></div>
        <div class="stat-card"><strong>❄️ بارد</strong><span id="coldCount">0</span></div>
        <div class="stat-card"><strong>🔥 ساخن</strong><span id="hotCount">0</span></div>
        <div class="stat-card"><strong>⭐ محتمل</strong><span id="leadCount">0</span></div>
      </div>
    </div>
  </div>
</div>

<!-- PWA Install Banner -->
<div id="installBanner" class="install-banner hidden">
  <span style="font-size:1.8rem;">📲</span>
  <div>
    <strong>تثبيت التطبيق</strong><br>
    <small style="color:var(--text-secondary);">خلي الوصول أسرع على موبايلك</small>
  </div>
  <button id="installBtn" class="btn btn-primary" style="padding:8px 18px;">تثبيت</button>
  <button id="dismissInstallBtn" class="btn btn-ghost" style="padding:6px 10px;">✕</button>
</div>

<input type="file" id="importFileInput" accept=".json,application/json" class="hidden">

<script>
  (function() {
    // ==================== CONFIGURATION ====================
    // ⚠️ غير الرابط ده بعد نشر Google Apps Script
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvhaMfw3EFnBo0m12rRz27b8Ny3FLmMuwyztVHsHyDHcUNcN-aDopL6hSdvn7NiRyF/exec';
    
    // ==================== STATE ====================
    let currentUser = null;
    let clients = [];
    let isSaving = false;
    let deferredPrompt = null;

    // ==================== DOM ====================
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // ==================== PWA Install ====================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('#installBanner').classList.remove('hidden');
    });

    $('#installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install:', outcome);
        deferredPrompt = null;
      }
      $('#installBanner').classList.add('hidden');
    });

    $('#dismissInstallBtn').addEventListener('click', () => {
      $('#installBanner').classList.add('hidden');
    });

    // ==================== API ====================
    async function apiCall(params) {
      const url = new URL(GAS_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.append(k, v));
      const res = await fetch(url.toString());
      return res.json();
    }

    // ==================== Toast Message ====================
    function showMessage(msg, type) {
      const el = $('#loginMessage');
      el.textContent = msg;
      el.className = `message-toast show ${type}`;
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    // ==================== LOGIN / REGISTER ====================
    async function login() {
      const username = $('#usernameInput').value.trim();
      const password = $('#passwordInput').value.trim();
      if (!username || !password) return showMessage('املأ جميع الحقول', 'error');
      
      try {
        const result = await apiCall({ action: 'login', username, password });
        if (result.success) {
          currentUser = username;
          $('#currentUserDisplay').textContent = username;
          $('#loginScreen').classList.add('hidden');
          $('#mainPanel').classList.remove('hidden');
          await loadClients();
        } else {
          showMessage(result.message || 'خطأ في البيانات', 'error');
        }
      } catch(e) {
        showMessage('فشل الاتصال بالخادم', 'error');
      }
    }

    async function register() {
      const username = $('#usernameInput').value.trim();
      const password = $('#passwordInput').value.trim();
      if (!username || !password) return showMessage('املأ جميع الحقول', 'error');
      if (username.length < 3 || password.length < 3) return showMessage('3 أحرف على الأقل', 'error');
      
      try {
        const result = await apiCall({ action: 'register', username, password });
        if (result.success) {
          showMessage('✅ تم إنشاء الحساب! سجل دخولك الآن', 'success');
        } else {
          showMessage(result.message || 'فشل الإنشاء', 'error');
        }
      } catch(e) {
        showMessage('فشل الاتصال', 'error');
      }
    }

    function logout() {
      currentUser = null;
      clients = [];
      $('#loginScreen').classList.remove('hidden');
      $('#mainPanel').classList.add('hidden');
      $('#usernameInput').value = '';
      $('#passwordInput').value = '';
    }

    // ==================== CLIENTS ====================
    async function loadClients() {
      if (!currentUser) return;
      try {
        clients = await apiCall({ action: 'getClients', username: currentUser });
        clients = Array.isArray(clients) ? clients : [];
        renderTable();
      } catch(e) { console.error(e); }
    }

    async function saveClients() {
      if (!currentUser || isSaving) return;
      isSaving = true;
      try {
        await apiCall({ action: 'saveClients', username: currentUser, clients: JSON.stringify(clients) });
      } catch(e) { console.error(e); }
      isSaving = false;
    }

    function addClient() {
      const name = $('#newName').value.trim();
      const mobile = $('#newMobile').value.trim();
      if (!name || !mobile) return alert('الاسم والموبايل مطلوبان');
      clients.push({
        name, mobile,
        status: $('#newStatus').value,
        lastContact: '',
        notes: ''
      });
      $('#newName').value = '';
      $('#newMobile').value = '';
      renderTable();
      saveClients();
    }

    function deleteClient(i) {
      if (!confirm('حذف هذا العميل؟')) return;
      clients.splice(i, 1);
      renderTable();
      saveClients();
    }

    function updateField(i, field, value) {
      if (clients[i]) {
        clients[i][field] = value;
        if (field === 'status') renderTable();
        updateStats();
        saveClients();
      }
    }

    // ==================== RENDER ====================
    function esc(text) {
      return String(text).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    }

    function statusClass(s) {
      return { first:'status-first', cold:'status-cold', hot:'status-hot', lead:'status-lead' }[s] || '';
    }
    function statusLabel(s) {
      return { first:'اول مرة', cold:'بارد', hot:'ساخن', lead:'محتمل' }[s] || s;
    }

    function renderTable() {
      const tbody = $('#clientsTable tbody');
      tbody.innerHTML = '';
      if (!clients.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding:28px;">لا يوجد عملاء بعد</td></tr>';
        updateStats();
        return;
      }
      clients.forEach((c, i) => {
        const mobile = c.mobile || '';
        const wa = mobile ? `https://wa.me/${mobile.replace(/\D/g,'')}` : '#';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:700;">${esc(c.name)}</td>
          <td dir="ltr">${esc(mobile)}</td>
          <td>
            <select class="status-select" data-i="${i}" style="padding:6px 8px;font-size:0.8rem;">
              <option value="first" ${c.status==='first'?'selected':''}>اول مرة</option>
              <option value="cold" ${c.status==='cold'?'selected':''}>بارد</option>
              <option value="hot" ${c.status==='hot'?'selected':''}>ساخن</option>
              <option value="lead" ${c.status==='lead'?'selected':''}>محتمل</option>
            </select>
          </td>
          <td><a class="whatsapp-link" href="${wa}" target="_blank" title="واتساب">💬</a></td>
          <td><input type="date" value="${c.lastContact||''}" data-i="${i}" class="date-input" style="padding:6px;font-size:0.8rem;"></td>
          <td><textarea data-i="${i}" class="notes-input" rows="1" style="padding:6px;font-size:0.8rem;" placeholder="ملاحظات">${esc(c.notes||'')}</textarea></td>
          <td><button class="delete-btn" data-i="${i}">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });

      // Events
      $$('.status-select').forEach(s => s.addEventListener('change', function() {
        updateField(+this.dataset.i, 'status', this.value);
      }));
      $$('.date-input').forEach(d => d.addEventListener('change', function() {
        updateField(+this.dataset.i, 'lastContact', this.value);
      }));
      $$('.notes-input').forEach(n => n.addEventListener('input', function() {
        updateField(+this.dataset.i, 'notes', this.value);
      }));
      $$('.delete-btn').forEach(b => b.addEventListener('click', function() {
        deleteClient(+this.dataset.i);
      }));
      updateStats();
    }

    function updateStats() {
      $('#totalCount').textContent = clients.length;
      $('#firstCount').textContent = clients.filter(c=>c.status==='first').length;
      $('#coldCount').textContent = clients.filter(c=>c.status==='cold').length;
      $('#hotCount').textContent = clients.filter(c=>c.status==='hot').length;
      $('#leadCount').textContent = clients.filter(c=>c.status==='lead').length;
    }

    // ==================== IMPORT / PRINT ====================
    $('#importBtn').addEventListener('click', () => $('#importFileInput').click());
    $('#importFileInput').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            clients = [...clients, ...data];
            renderTable();
            await saveClients();
            alert('✅ تم الاستيراد');
          }
        } catch(ex) { alert('ملف غير صالح'); }
      };
      reader.readAsText(file);
      this.value = '';
    });
    $('#printBtn').addEventListener('click', () => window.print());

    // ==================== THEME ====================
    function initTheme() {
      if (localStorage.getItem('crm_theme') === 'dark') document.body.classList.add('dark');
    }
    $('#themeToggleBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('crm_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    // ==================== EVENT BINDING ====================
    $('#loginBtn').addEventListener('click', login);
    $('#registerBtn').addEventListener('click', register);
    $('#passwordInput').addEventListener('keypress', e => e.key==='Enter' && login());
    $('#logoutBtn').addEventListener('click', logout);
    $('#addClientBtn').addEventListener('click', addClient);

    // ==================== INIT ====================
    initTheme();
    $('#loginScreen').classList.remove('hidden');
    $('#mainPanel').classList.add('hidden');
  })();
</script>

</body>
</html>
